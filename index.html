<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>Vibe Coding Active</title>
<style>
  :root {
    --bg: #05070d;
    --surface: #0b0f1a;
    --line: #16203a;
    --text: #e6ebf5;
    --muted: #7d889f;
    --neon: #2f8bff;
    --neon-soft: rgba(47, 139, 255, 0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(47, 139, 255, 0.10), transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 560px; text-align: center; }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 28px;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--neon);
    box-shadow: 0 0 10px var(--neon);
    animation: pulse 2.4s ease-in-out infinite;
  }
  h1 {
    font-size: clamp(2.6rem, 11vw, 4.6rem);
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: -0.035em;
    color: var(--neon);
    text-shadow: 0 0 24px var(--neon-soft), 0 0 60px rgba(47, 139, 255, 0.18);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .sub {
    margin: 22px auto 0;
    max-width: 34ch;
    font-size: 1.05rem;
    line-height: 1.6;
    color: var(--muted);
  }
  ul {
    list-style: none;
    margin: 48px auto 0;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--surface);
    overflow: hidden;
    text-align: left;
  }
  li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 22px;
    font-size: 1rem;
  }
  li + li { border-top: 1px solid var(--line); }
  li span:last-child {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--neon);
  }
  footer {
    margin-top: 32px;
    font-size: 12px;
    color: #4a5469;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  @media (prefers-reduced-motion: reduce) {
    .dot, h1 { animation: none; }
  }
</style>
</head>
<body>
  <main>
    <div class="status"><span class="dot"></span>System online</div>
    <h1>Vibe Coding Active</h1>
    <p class="sub">Ideas go in, live deployments come out. Shipped from a single conversation.</p>
    <ul>
      <li><span>GitHub</span><span>Connected</span></li>
      <li><span>Vercel</span><span>Connected</span></li>
      <li><span>Figma</span><span>Connected</span></li>
    </ul>
    <footer>ai-vibe-test</footer>
  </main>
</body>
</html>
